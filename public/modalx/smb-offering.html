<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noai, noimageai">

<style>
/* ===========================================================================
   Apple Human Interface Guidelines, dark and light, seven persona tints.

   Two rules from HIG drive every decision below.

   1. Content is opaque, chrome is glass. Liquid Glass is a material for
      floating controls and navigation, not for the content underneath them.
      Frosting a card that nothing floats over just costs legibility, so the
      navigation bar, the toolbar, the sheet and the segmented control are
      glass, and every list and card is a solid grouped background.

   2. Tint is one colour, not a palette. iOS expresses brand with a single
      accent applied to interactive elements. Each persona re-tints; the
      neutrals stay system neutrals so the app reads as native throughout.
   =========================================================================== */

:root{
  color-scheme:dark;
  /* --- system greys, dark ---------------------------------------------- */
  --bg:#000000;
  --group:#000000;
  --card:#1C1C1E;          /* secondarySystemGroupedBackground */
  --card-2:#2C2C2E;        /* tertiarySystemGroupedBackground */
  --card-3:#3A3A3C;
  --label:#FFFFFF;
  --label-2:rgba(235,235,245,.68);
  --label-3:rgba(235,235,245,.48);
  --separator:rgba(84,84,88,.62);
  --fill:rgba(120,120,128,.24);
  --fill-2:rgba(120,120,128,.16);
  --red:#FF453A;
  --green:#30D158;
  --amber:#FFD60A;

  /* --- Liquid Glass ----------------------------------------------------- */
  --glass:rgba(30,30,32,.58);
  --glass-thick:rgba(24,24,26,.76);
  --glass-line:rgba(255,255,255,.10);
  --glass-spec:rgba(255,255,255,.16);
  --glass-shadow:0 10px 34px rgba(0,0,0,.46);
  --blur:26px;

  /* --- SF type scale ---------------------------------------------------- */
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",
     "Segoe UI",system-ui,Roboto,sans-serif;
  --f-round:-apple-system,"SF Pro Rounded",ui-rounded,var(--f);

  /* --- geometry --------------------------------------------------------- */
  --r-card:18px;           /* per-persona, kept inside a tight Apple range */
  --r-inner:11px;
  --r-sheet:38px;
  --gutter:16px;
  --tap:44px;              /* HIG minimum touch target */
}

/* ------------------------------------------------------- persona tints ---
   One accent each. The only other thing that moves is the corner radius of
   grouped containers, and only inside 14 to 22px, which is the range iOS
   itself uses between widgets and cards. Anything wider stops reading as the
   same operating system. */
/* Two tint roles, not one. In dark mode a single accent cannot serve both
   jobs: bright enough to read as 13pt text on a card means too bright to
   carry a white label. --tint is the readable one, --tint-fill is the one
   white sits on. In light mode they converge, because a colour dark enough
   for a white label is already dark enough to read on white. */
.t-gym       {--tint:#2FD8C3; --tint-fill:#198376; --tint-soft:rgba(47,216,195,.20);  --r-card:18px}
.t-salon     {--tint:#FF6482; --tint-fill:#E9002D; --tint-soft:rgba(255,100,130,.20); --r-card:22px}
.t-restaurant{--tint:#FF9F0A; --tint-fill:#A36300; --tint-soft:rgba(255,159,10,.20);  --r-card:16px}
.t-realestate{--tint:#0A84FF; --tint-fill:#0072E5; --tint-soft:rgba(10,132,255,.20);  --r-card:14px}
.t-doctor    {--tint:#64A8FF; --tint-fill:#006DF8; --tint-soft:rgba(100,168,255,.20); --r-card:20px}
.t-clinic    {--tint:#BF5AF2; --tint-fill:#AE2FEF; --tint-soft:rgba(191,90,242,.20);  --r-card:16px}
.t-wedding   {--tint:#FF7A5C; --tint-fill:#E12900; --tint-soft:rgba(255,122,92,.20);  --r-card:22px}

/* --------------------------------------------------------- light mode ---
   systemGroupedBackground is grey and the cards are white, which is the
   inverse of dark mode and the reason iOS lists read as cards in both. */
.light{
  color-scheme:light;
  --bg:#F2F2F7;
  --group:#F2F2F7;
  --card:#FFFFFF;
  --card-2:#F2F2F7;
  --card-3:#E5E5EA;
  --label:#000000;
  --label-2:rgba(60,60,67,.74);
  --label-3:rgba(60,60,67,.56);
  --separator:rgba(60,60,67,.29);
  --fill:rgba(120,120,128,.12);
  --fill-2:rgba(120,120,128,.08);
  --red:#D70015;
  --green:#248A3D;
  --amber:#B25000;
  --glass:rgba(250,250,252,.62);
  --glass-thick:rgba(255,255,255,.78);
  --glass-line:rgba(0,0,0,.07);
  --glass-spec:rgba(255,255,255,.72);
  --glass-shadow:0 10px 34px rgba(0,0,0,.14);
}
.light.t-gym       {--tint:#198376; --tint-fill:#198376; --tint-soft:rgba(25,131,118,.14)}
.light.t-salon     {--tint:#E9002D; --tint-fill:#E9002D; --tint-soft:rgba(233,0,45,.14)}
.light.t-restaurant{--tint:#A36300; --tint-fill:#A36300; --tint-soft:rgba(163,99,0,.14)}
.light.t-realestate{--tint:#0072E5; --tint-fill:#0072E5; --tint-soft:rgba(0,114,229,.14)}
.light.t-doctor    {--tint:#006DF8; --tint-fill:#006DF8; --tint-soft:rgba(58,111,216,.14)}
.light.t-clinic    {--tint:#AE2FEF; --tint-fill:#AE2FEF; --tint-soft:rgba(174,47,239,.14)}
.light.t-wedding   {--tint:#E12900; --tint-fill:#E12900; --tint-soft:rgba(225,41,0,.14)}


/* ==================================================  DEVICE CHROME  =====
   A simulated status bar and home indicator, shown only inside the desktop
   device frame. On a real phone the operating system already draws both, and
   a second set below the browser chrome would read as a bug rather than as
   realism, so below 600px these are hidden and the safe-area insets do the
   work instead. */
.statusbar,.homebar{display:none}

.statusbar{position:relative;z-index:31;flex:none;height:54px;
  align-items:center;justify-content:space-between;padding:0 12px 0 30px;
  color:var(--label);font-size:15px;font-weight:600;letter-spacing:-.2px;
  font-variant-numeric:tabular-nums;pointer-events:none;
  transition:color .4s ease}
.sb-time{min-width:56px}
.sb-right{display:flex;align-items:center;gap:6px}
.sb-right svg{display:block;fill:currentColor}
/* the Dynamic Island is hardware, so it stays black in both appearances */
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);
  width:118px;height:34px;border-radius:19px;background:#000;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.06)}
.island::after{content:"";position:absolute;right:11px;top:50%;
  transform:translateY(-50%);width:9px;height:9px;border-radius:50%;
  background:#0B0B0D;box-shadow:inset 0 0 2px rgba(90,120,160,.55)}

/* battery: an outline, a cap, and a fill that tracks the real level when the
   browser exposes it */
.batt{position:relative;width:25px;height:12px;border-radius:3.6px;
  box-shadow:inset 0 0 0 1px currentColor;opacity:.9}
.batt::after{content:"";position:absolute;left:100%;top:50%;
  transform:translateY(-50%);margin-left:1.6px;width:1.6px;height:4.4px;
  border-radius:0 1.5px 1.5px 0;background:currentColor;opacity:.55}
.batt i{position:absolute;left:1.8px;top:1.8px;bottom:1.8px;border-radius:1.8px;
  background:currentColor;transition:width .5s ease,background-color .3s ease}
.batt.charging i{background:#30D158}
.batt.low i{background:#FF453A}

.homebar{position:relative;z-index:31;flex:none;height:26px;
  align-items:center;justify-content:center;touch-action:none}
.homebar i{display:block;width:140px;height:5px;border-radius:3px;
  background:var(--label);opacity:.9;transition:opacity .2s ease,
  transform .3s cubic-bezier(.2,.9,.3,1.2),background-color .4s ease}
.homebar:active i{transform:scaleX(.9);opacity:.55}

@media (min-width:600px){
  .statusbar,.homebar{display:flex}
  .phone{--homebar:26px}
}

/* ------------------------------------------------------------------ base */
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--label);font-family:var(--f);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;
  font-family:var(--f);padding:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px;border-radius:8px}

/* iOS press feedback: a quick scale with a spring back, no colour flash */
.tap{transition:transform .22s cubic-bezier(.2,.9,.3,1.2),opacity .16s ease}
.tap:active{transform:scale(.96);opacity:.72}
.row-tap{transition:background-color .12s ease}
.row-tap:active{background:var(--fill-2)}

/* The height has to be definite, not a minimum. With min-height the flex
   column grows to its content, the inner scroller never engages, and the two
   absolutely positioned controls land at the foot of the document instead of
   floating over the viewport, which is what broke this on a phone. */
.phone{position:relative;width:100%;max-width:440px;margin:0 auto;
  height:100vh;height:100dvh;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;
  transition:background-color .4s ease}

/* ------------------------------------------------------- type helpers --- */
.large-title{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px}
.title1{font-size:28px;line-height:34px;font-weight:700;letter-spacing:.36px}
.title2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:.35px}
.title3{font-size:20px;line-height:25px;font-weight:600;letter-spacing:.38px}
.headline{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.41px}
.body{font-size:17px;line-height:22px;letter-spacing:-.41px}
.callout{font-size:16px;line-height:21px;letter-spacing:-.32px}
.subhead{font-size:15px;line-height:20px;letter-spacing:-.24px}
.foot{font-size:13px;line-height:18px;letter-spacing:-.08px}
.cap1{font-size:12px;line-height:16px}
.cap2{font-size:11px;line-height:13px}
.sec{color:var(--label-2)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* =====================================================  LIQUID GLASS  ==== */
.glass{position:relative;background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(190%);
  backdrop-filter:blur(var(--blur)) saturate(190%)}
/* the specular edge: a bright hairline on top, dimming towards the bottom.
   This is what separates glass from a plain translucent panel. */
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;
  box-shadow:inset 0 .5px 0 var(--glass-spec),
             inset 0 0 0 .5px var(--glass-line),
             inset 0 -.5px 0 rgba(0,0,0,.16)}
.glass-thick{background:var(--glass-thick);
  -webkit-backdrop-filter:blur(40px) saturate(190%);
  backdrop-filter:blur(40px) saturate(190%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass,.glass-thick{background:var(--card)}
  .light .glass,.light .glass-thick{background:#FFF}
}

/* ------------------------------------------------------ navigation bar ---
   Large title that collapses on scroll, exactly as UINavigationController
   does it: the title shrinks into the bar, the bar gains its material and a
   hairline, and the whole thing floats over the content. */
.nav{position:sticky;top:0;z-index:20;flex:none;
  padding-top:env(safe-area-inset-top);
  transition:background-color .25s ease}
.nav::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.5px;
  background:var(--separator);opacity:0;transition:opacity .25s ease}
.nav.compact::after{opacity:1}
.nav:not(.compact){background:transparent;-webkit-backdrop-filter:none;
  backdrop-filter:none}
.nav:not(.compact)::after{opacity:0}
.navbar{display:flex;align-items:center;gap:8px;height:52px;padding:0 8px}
.navttl{flex:1;min-width:0;text-align:center;font-size:17px;line-height:22px;
  font-weight:600;letter-spacing:-.41px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;opacity:0;transform:translateY(7px);
  transition:opacity .22s ease,transform .22s ease}
.nav.compact .navttl{opacity:1;transform:none}
.navlarge{padding:0 var(--gutter) 8px;overflow:hidden;
  transition:opacity .2s ease,max-height .26s ease,padding .26s ease}
.nav.compact .navlarge{opacity:0;max-height:0;padding-top:0;padding-bottom:0;
  pointer-events:none}
.navlarge h1{margin:0;font-size:34px;line-height:41px;font-weight:700;
  letter-spacing:.37px}
.navlarge p{margin:2px 0 0;font-size:15px;line-height:20px;color:var(--label-2)}

/* circular glass buttons, the iOS 26 navigation idiom */
.navbtn{flex:none;width:38px;height:38px;border-radius:50%;display:grid;
  place-items:center;color:var(--tint);overflow:hidden;
  box-shadow:var(--glass-shadow)}
.navbtn svg{width:21px;height:21px;fill:currentColor}
.navbtn.avatar{color:var(--label);font-size:13px;font-weight:700;
  font-family:var(--f-round)}
.navbtn .ini{position:relative;z-index:1;letter-spacing:.2px}

/* ------------------------------------------------------------- content --- */
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:0 var(--gutter) 40px;scrollbar-width:none;scroll-behavior:smooth}
.scroll::-webkit-scrollbar{display:none}

/* grouped list section headers: uppercase, small, indented, iOS Settings */
.grouphead{padding:26px 16px 7px;font-size:13px;line-height:18px;
  font-weight:400;letter-spacing:-.08px;color:var(--label-2);
  text-transform:uppercase}
.groupfoot{padding:7px 16px 0;font-size:13px;line-height:18px;
  color:var(--label-2)}

/* inset grouped list, the core Apple content container */
.list{background:var(--card);border-radius:var(--r-card);overflow:hidden;
  transition:border-radius .4s cubic-bezier(.2,.9,.3,1.2),background-color .4s ease}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  min-height:var(--tap);padding:11px 16px;position:relative}
.item+.item::before{content:"";position:absolute;left:16px;right:0;top:0;
  height:.5px;background:var(--separator)}
.item.inset+.item.inset::before{left:60px}
.txt{flex:1;min-width:0}
.txt .t{display:block;font-size:17px;line-height:22px;letter-spacing:-.41px}
.txt .s{display:block;font-size:13px;line-height:18px;color:var(--label-2);
  margin-top:1px}
.trail{flex:none;display:flex;align-items:center;gap:6px;
  font-size:17px;letter-spacing:-.41px;color:var(--label-2)}
.chev{flex:none;width:9px;height:15px;color:var(--label-3)}
.chev svg{width:9px;height:15px;fill:currentColor;display:block}

/* Status is a leading badge, not a pill wedged beside the title.
   That is the layout fault in the old cards: a tag competing with a title for
   the same line will always truncate one of them on a narrow screen. */
.badge{flex:none;width:30px;height:30px;border-radius:8px;display:grid;
  place-items:center;background:var(--tint-fill);color:#fff}
.badge svg{width:18px;height:18px;fill:currentColor}
.badge.good{background:var(--green)}
.badge.bad{background:var(--red)}
.badge.warn{background:var(--amber);color:#000}
.badge.lg{width:34px;height:34px;border-radius:9px}
.light .badge.warn{color:#fff}
</style>

<style>
/* ------------------------------------------------------------- widgets --- */
.widget{background:var(--card);border-radius:var(--r-card);padding:18px 18px 16px;
  position:relative;overflow:hidden;
  transition:border-radius .4s cubic-bezier(.2,.9,.3,1.2),background-color .4s ease}
.widget .glow{position:absolute;top:-56%;right:-22%;width:76%;aspect-ratio:1;
  border-radius:50%;pointer-events:none;opacity:.5;
  background:radial-gradient(circle,var(--tint),transparent 66%)}
.widget .kicker{position:relative;font-size:13px;line-height:18px;font-weight:600;
  color:var(--tint);letter-spacing:-.08px}
.money{position:relative;display:flex;align-items:baseline;gap:9px;
  margin-top:7px;flex-wrap:wrap}
.money .v{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px}
.money .d{font-size:15px;line-height:20px;font-weight:600;color:var(--green)}
.money .d.dn{color:var(--red)}
.widget .sub{position:relative;font-size:13px;line-height:18px;
  color:var(--label-2);margin-top:3px}

/* 12 month column chart. Rounded caps, last column tinted, axis beneath. */
.cols{position:relative;display:flex;align-items:flex-end;gap:4px;height:52px;
  margin-top:18px}
.cols i{flex:1;display:block;border-radius:4px;background:var(--fill);
  transform-origin:bottom;animation:col .55s cubic-bezier(.2,.9,.3,1.1) both}
.cols i.on{background:var(--tint)}
@keyframes col{from{transform:scaleY(0)}}
.axis{position:relative;display:flex;justify-content:space-between;margin-top:8px;
  font-size:12px;line-height:16px;color:var(--label-2)}

/* 2 up metric cards */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.metric{background:var(--card);border-radius:var(--r-card);padding:14px 15px 13px;
  transition:border-radius .4s cubic-bezier(.2,.9,.3,1.2),background-color .4s ease}
.metric .k{display:block;font-size:13px;line-height:18px;color:var(--label-2)}
.metric .v{display:block;font-size:26px;line-height:32px;font-weight:600;
  letter-spacing:.35px;margin-top:5px}
.metric .d{display:block;font-size:13px;line-height:18px;font-weight:600;
  margin-top:1px;color:var(--green)}
.metric .d.dn{color:var(--red)}

/* the read: a card with a trend line, not a row with a graph squeezed in */
.read{background:var(--card);border-radius:var(--r-card);overflow:hidden;
  transition:border-radius .4s cubic-bezier(.2,.9,.3,1.2),background-color .4s ease}
.readtop{display:flex;align-items:center;gap:12px;padding:15px 16px 12px}
.readtop .lbl{flex:1;min-width:0}
.readtop .lbl b{display:block;font-size:17px;line-height:22px;font-weight:600;
  letter-spacing:-.41px}
.readtop .lbl span{display:block;font-size:13px;line-height:18px;
  color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.growth{flex:none;display:flex;align-items:flex-end;gap:3.5px;height:26px}
.growth i{display:block;width:5px;border-radius:2.5px;background:var(--tint);
  transform-origin:bottom;animation:climb 2.8s cubic-bezier(.2,.9,.3,1.15) infinite}
.growth i:nth-child(1){height:32%;animation-delay:0s}
.growth i:nth-child(2){height:50%;animation-delay:.11s}
.growth i:nth-child(3){height:68%;animation-delay:.22s}
.growth i:nth-child(4){height:84%;animation-delay:.33s}
.growth i:nth-child(5){height:100%;animation-delay:.44s}
.growth.dn{flex-direction:row-reverse}
.growth.dn i{background:var(--red)}
@keyframes climb{
  0%{transform:scaleY(.22);opacity:.3}
  20%{transform:scaleY(1);opacity:1}
  72%{transform:scaleY(1);opacity:1}
  100%{transform:scaleY(.22);opacity:.3}}
/* the shared reduced-motion rule would freeze these on the final keyframe,
   which is the collapsed state, so pin them open explicitly */
@media (prefers-reduced-motion:reduce){
  .growth i{animation:none!important;transform:none!important;opacity:1!important}}
.readbody{padding:0 16px 14px;font-size:15px;line-height:21px;color:var(--label-2);
  letter-spacing:-.24px}
/* Inset, so the card's own background stays visible around it. As a
   full-bleed band it used --card-2, which in the light scheme is the same
   value as the page background, so the card appeared to stop early and this
   block to fall out onto the page. */
.readnext{display:flex;gap:11px;margin:0 14px 14px;padding:13px 14px;
  border-radius:13px;background:var(--fill);align-items:flex-start}
.readnext .badge{margin-top:1px}
.readnext .tx{flex:1;font-size:15px;line-height:21px;letter-spacing:-.24px}
/* The eyebrow is a neutral secondary label rather than tint: 13px semibold
   tint on a filled band measures 3.5 to 4.2 across the seven themes, under
   the 4.5 threshold. The tinted badge carries the accent, and an icon only
   needs 3.0. */
.readnext .tx b{display:block;font-size:13px;line-height:18px;
  color:var(--label-2);font-weight:600;text-transform:uppercase;
  letter-spacing:.4px;margin-bottom:1px}

/* bar rows inside a grouped list */
.barrow{display:block;padding:12px 16px;position:relative}
.barrow+.barrow::before{content:"";position:absolute;left:16px;right:0;top:0;
  height:.5px;background:var(--separator)}
.barhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.barhead .k{flex:1;font-size:15px;line-height:20px;letter-spacing:-.24px}
.barhead .v{font-size:15px;line-height:20px;color:var(--label-2)}
.track{display:block;height:6px;border-radius:3px;background:var(--fill);
  overflow:hidden}
.fill{display:block;height:100%;border-radius:3px;background:var(--tint);width:0;
  transition:width .7s cubic-bezier(.2,.9,.3,1)}
.fill.ghost{background:var(--fill)}
.fill.zero{background:var(--red)}

/* disclosure row that expands in place */
.disc .item{cursor:pointer}
.disc .chev{transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
.disc [aria-expanded="true"] .chev{transform:rotate(90deg)}
.panel{display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .34s cubic-bezier(.32,.72,0,1)}
.disc.open .panel{grid-template-rows:1fr}
.panel>.inner{overflow:hidden;min-height:0}
.panel .pad{padding:2px 16px 14px}
.prow{padding:11px 0;position:relative}
.prow+.prow::before{content:"";position:absolute;left:0;right:0;top:0;height:.5px;
  background:var(--separator)}
.prow .k{display:block;font-size:13px;line-height:18px;color:var(--label-2);
  margin-bottom:2px}
.prow .v{display:block;font-size:15px;line-height:21px;letter-spacing:-.24px}
.prow .v b{font-weight:600}

/* -------------------------------------------------- segmented control --- */
.seg{position:relative;display:flex;padding:2px;border-radius:10px;
  background:var(--fill-2);margin:4px 0 2px;overflow:hidden}
.seg .knob{position:absolute;top:2px;bottom:2px;border-radius:8px;
  background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.28),
  0 0 0 .5px rgba(0,0,0,.04);
  transition:transform .32s cubic-bezier(.32,.72,0,1),width .32s cubic-bezier(.32,.72,0,1)}
.light .seg .knob{background:#FFF}
.seg button{position:relative;z-index:1;flex:1;height:32px;font-size:13px;
  font-weight:600;letter-spacing:-.08px;color:var(--label-2);
  transition:color .2s ease}
.seg button[aria-selected="true"]{color:var(--label)}
.seg.glass{background:var(--glass);border-radius:12px}

/* ------------------------------------------------------------ controls --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:50px;padding:0 22px;border-radius:14px;font-size:17px;
  font-weight:600;letter-spacing:-.41px}
.btn.filled{background:var(--tint-fill);color:#fff}
.light .btn.filled{color:#fff}
.btn.tinted{background:var(--tint-soft);color:var(--tint)}
.btn.plain{color:var(--tint);min-height:44px;padding:0 8px}
.btn[disabled]{background:var(--fill);color:var(--label-3);pointer-events:none}
.btn.wide{display:flex;width:100%}

/* iOS switch */
.sw{flex:none;width:51px;height:31px;border-radius:16px;background:var(--fill);
  position:relative;transition:background-color .28s cubic-bezier(.32,.72,0,1)}
.sw i{position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;
  background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.06);
  transition:transform .28s cubic-bezier(.32,.72,0,1)}
[aria-checked="true"]>.sw{background:var(--green)}
[aria-checked="true"]>.sw i{transform:translateX(20px)}

/* choice chips for channels: capsule, tinted when on, check slides in */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{display:inline-flex;align-items:center;gap:5px;height:var(--tap);
  padding:0 17px;border-radius:22px;background:var(--card);
  font-size:15px;font-weight:500;letter-spacing:-.24px;color:var(--label);
  transition:background-color .24s ease,color .24s ease,padding .28s
    cubic-bezier(.32,.72,0,1)}
.chip .tick{width:0;overflow:hidden;display:grid;place-items:center;
  transition:width .28s cubic-bezier(.32,.72,0,1)}
.chip .tick svg{width:15px;height:15px;fill:currentColor;flex:none}
.chip[aria-pressed="true"]{background:var(--tint-fill);color:#fff;padding-left:12px}
.chip[aria-pressed="true"] .tick{width:15px}
.chip[disabled]{opacity:.45;pointer-events:none}

/* ------------------------------------------------------------ toolbar ---
   Floating glass bar. It clears the safe area and never touches the edges,
   which is what makes it read as floating rather than docked. */
.toolbar{position:absolute;left:12px;right:12px;z-index:22;
  bottom:calc(12px + var(--homebar,0px) + env(safe-area-inset-bottom));
  border-radius:26px;padding:9px;box-shadow:var(--glass-shadow);
  animation:tbin .42s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes tbin{from{opacity:0;transform:translateY(26px)}}
.tbhint{position:relative;z-index:1;text-align:center;font-size:13px;
  line-height:18px;color:var(--label-2);padding:2px 0 8px}
.tbrow{position:relative;z-index:1;display:flex;align-items:center;gap:9px}
.tbrow .btn.filled{flex:1}

/* the primary entry point, a floating glass capsule with a tinted core */
.start{position:absolute;right:14px;z-index:22;
  bottom:calc(16px + var(--homebar,0px) + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:9px;height:56px;padding:0 22px;
  border-radius:28px;background:var(--tint-fill);color:#fff;font-size:17px;
  font-weight:600;letter-spacing:-.41px;
  box-shadow:0 8px 26px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.28),
    inset 0 .5px 0 rgba(255,255,255,.34);
  animation:tbin .46s cubic-bezier(.2,.9,.3,1.15) both}
.start svg{width:20px;height:20px;fill:currentColor}

/* --------------------------------------------------------- step header --- */
.steps{display:flex;gap:5px;padding:0 var(--gutter) 12px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--fill);
  overflow:hidden;position:relative}
.steps i::after{content:"";position:absolute;inset:0;border-radius:2px;
  background:var(--tint);transform:scaleX(0);transform-origin:left;
  transition:transform .45s cubic-bezier(.32,.72,0,1)}
.steps i.done::after{transform:scaleX(1);opacity:.42}
.steps i.now::after{transform:scaleX(1)}

/* --------------------------------------------------------------- voice --- */
.mic{display:flex;align-items:center;gap:15px;width:100%;text-align:left;
  padding:16px;border-radius:var(--r-card);background:var(--card)}
.orb{flex:none;width:54px;height:54px;border-radius:50%;display:grid;
  place-items:center;background:var(--tint-fill);color:#fff;
  transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
.mic.live .orb{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--tint-soft)}
  70%{box-shadow:0 0 0 16px transparent}100%{box-shadow:0 0 0 0 transparent}}
.orb svg{width:24px;height:24px;fill:currentColor}
.wave{display:flex;align-items:center;gap:3px;height:22px}
.wave i{display:block;width:3px;height:5px;border-radius:2px;background:#fff}
.mic.live .wave i{animation:bob .8s ease-in-out infinite}
@keyframes bob{0%,100%{height:5px}50%{height:20px}}
.mic .tx{flex:1;min-width:0}
.mic .tx b{display:block;font-size:17px;line-height:22px;font-weight:600;
  letter-spacing:-.41px}
.mic .tx span{display:block;font-size:13px;line-height:18px;color:var(--label-2);
  margin-top:1px}

/* a speech bubble, which is what a transcript is */
.said{background:var(--card);border-radius:var(--r-card);
  border-top-left-radius:7px;padding:15px 17px;margin-top:11px}
.said .who{display:block;font-size:13px;line-height:18px;font-weight:600;
  color:var(--tint);margin-bottom:6px}
.said .tt{font-size:17px;line-height:24px;letter-spacing:-.41px}
.cur{display:inline-block;width:2px;height:18px;background:var(--tint);
  vertical-align:-3px;margin-left:2px;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}

/* generation trace */
.trace{background:var(--card);border-radius:var(--r-card);overflow:hidden}
.tr{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;
  position:relative;font-size:15px;line-height:21px;letter-spacing:-.24px;
  animation:trin .34s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes trin{from{opacity:0;transform:translateY(7px)}}
.tr+.tr::before{content:"";position:absolute;left:52px;right:0;top:0;height:.5px;
  background:var(--separator)}
.tr .ic{flex:none;width:24px;height:24px;border-radius:7px;display:grid;
  place-items:center;background:var(--tint-soft);color:var(--tint);margin-top:1px}
.tr .ic svg{width:15px;height:15px;fill:currentColor}
.tr.src .ic{background:var(--fill);color:var(--label-2)}
.tr.chk .ic{background:rgba(255,214,10,.18);color:var(--amber)}
.tr .gt{flex:1;min-width:0}
.tr .gd{display:block;font-size:13px;line-height:18px;color:var(--label-2);
  margin-top:1px;overflow-wrap:anywhere}
.tr.done{color:var(--green)}

.spinner{width:22px;height:22px;margin:16px auto 4px;border-radius:50%;
  border:2.5px solid var(--fill);border-top-color:var(--tint);
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skip{display:block;margin:10px auto 0;font-size:15px;color:var(--tint);
  padding:10px 16px;font-weight:500}

/* progress for publishing */
.prog{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;
  margin-bottom:14px}
.prog i{display:block;height:100%;width:0;background:var(--tint);border-radius:2px;
  transition:width .5s cubic-bezier(.32,.72,0,1)}

/* ----------------------------------------------------------- creative --- */
.art{position:relative;display:grid;place-items:center;border-radius:14px;
  height:196px;overflow:hidden;margin-bottom:14px;background:var(--card-2)}
/* taller, because the clip inside it is shot 9:16 and a 196px band shows
   almost nothing of a vertical frame */
.art.vid{height:320px}
/* Artwork is an element, never a url() inside a style attribute: the quotes a
   CSS url needs collide with the quotes the attribute needs. */
.clip,.shotimg{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block}
.scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.58))}
.scrim.soft{background:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.34))}
.over{position:relative;z-index:2;font-size:22px;font-weight:700;line-height:1.24;
  text-align:center;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.5);padding:0 22px;
  letter-spacing:-.4px}
.over.sm{font-size:18px;font-weight:600;max-width:88%}
.mark{position:absolute;z-index:2;left:15px;bottom:13px;font-size:12px;
  font-weight:600;color:rgba(255,255,255,.8)}
.play{position:absolute;z-index:2;right:13px;bottom:12px;width:46px;height:46px;
  border-radius:50%;background:rgba(255,255,255,.92);color:#111;display:grid;
  place-items:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.play svg{width:20px;height:20px;fill:currentColor;margin-left:2px}
.vbar{position:absolute;z-index:2;left:0;right:0;bottom:0;height:3px;
  background:rgba(255,255,255,.22)}
.vbar i{display:block;height:100%;width:0;background:#fff;transition:width .5s linear}
.beats{display:flex;flex-direction:column;gap:7px;margin:-2px 0 14px}
.beat{display:flex;gap:11px;align-items:flex-start;font-size:15px;line-height:21px;
  color:var(--label-2);padding:10px 12px;border-radius:11px;background:var(--card-2);
  letter-spacing:-.24px;transition:all .28s ease}
.beat .bn{flex:none;width:20px;height:20px;border-radius:50%;background:var(--fill);
  color:var(--label-2);font-size:11px;display:grid;place-items:center;
  font-weight:700;margin-top:1px}
.beat.on{color:var(--label);background:var(--tint-soft)}
.beat.on .bn{background:var(--tint-fill);color:#fff}
.beat.done .bn{background:var(--tint-soft);color:var(--tint)}

.brw{border-radius:14px;overflow:hidden;margin-bottom:14px;background:#fff}
.brwbar{display:flex;align-items:center;gap:6px;background:#E8E8ED;padding:9px 11px}
.brwbar i{width:8px;height:8px;border-radius:50%;background:#C7C7CC;display:block}
.brwbar .url{flex:1;margin-left:6px;background:#fff;border-radius:7px;
  padding:4px 10px;font-size:12px;color:#6D6D72;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.brwpage{background:#fff;color:#1C1C1E;max-height:330px;overflow:auto;
  scrollbar-width:none}
.brwpage::-webkit-scrollbar{display:none}
.pnav{display:flex;align-items:center;gap:8px;padding:13px 15px;
  border-bottom:.5px solid #E5E5EA;font-size:13px}
.pnav b{font-size:14px;margin-right:auto}
.pnav span{width:24px;height:5px;border-radius:3px;background:#E5E5EA;display:block}
.phero{position:relative;overflow:hidden;display:grid;place-items:center;
  padding:34px 18px;text-align:center}
.phero b{position:relative;z-index:2;font-size:21px;font-weight:700;color:#fff;
  line-height:1.24;text-shadow:0 2px 16px rgba(0,0,0,.45);letter-spacing:-.4px}
.pbody{margin:0;padding:15px 15px 10px;font-size:13px;line-height:1.65;color:#48484A}
.psec{display:flex;align-items:center;padding:12px 15px;
  border-top:.5px solid #E5E5EA;font-size:13px;font-weight:500;color:#1C1C1E}
.psec i{margin-left:auto;font-style:normal;color:#C7C7CC}
.pcta{margin:14px 15px;padding:12px;border-radius:11px;background:#1C1C1E;color:#fff;
  text-align:center;font-size:13px;font-weight:600}
.pfoot{padding:10px 15px 16px;font-size:12px;color:#6D6D72;text-align:center}

.gpost{border-radius:14px;overflow:hidden;margin-bottom:14px;background:var(--card-2)}
.ghead{display:flex;align-items:center;gap:10px;padding:12px 13px}
.gav{flex:none;width:36px;height:36px;border-radius:50%;background:var(--tint);
  color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.gwho b{display:block;font-size:14px;font-weight:600}
.gwho em{display:block;font-style:normal;font-size:12px;color:var(--label-2);
  margin-top:1px}
.gart{position:relative;overflow:hidden;height:120px}
.gtext{margin:0;padding:12px 13px 0;font-size:15px;line-height:21px;
  color:var(--label-2);letter-spacing:-.24px}
.gcta{margin:12px 13px 13px;padding:11px;border-radius:11px;text-align:center;
  font-size:15px;font-weight:600;color:var(--tint);background:var(--fill)}

/* ------------------------------------------------------ rank and cells --- */
.rank{display:block;position:relative;height:18px;margin-top:9px}
.rank::before{content:"";position:absolute;left:0;right:0;top:8px;height:2px;
  border-radius:1px;background:var(--fill)}
.rank i{position:absolute;top:4px;width:10px;height:10px;border-radius:50%;
  margin-left:-5px}
.rank .now{background:var(--tint);box-shadow:0 0 0 4px var(--tint-soft)}
.rank .was{background:transparent;box-shadow:inset 0 0 0 2px var(--label-3)}
.rank .move{top:8px;height:2px;border-radius:1px;margin-left:0;
  background:var(--tint);opacity:.45}
.rank .miss{left:100%;margin-left:-11px;background:transparent;
  box-shadow:inset 0 0 0 2px var(--red)}
.scale{display:flex;justify-content:space-between;font-size:12px;
  color:var(--label-2);margin-top:6px}
.cells{display:flex;gap:5px;margin-top:4px}
.cells i{flex:1;height:26px;border-radius:6px;background:var(--fill);
  transform-origin:bottom;animation:col .42s cubic-bezier(.2,.9,.3,1.1) both}
.cells i.on{background:var(--tint)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;
  box-shadow:inset 0 0 0 2px var(--red);margin-right:8px;vertical-align:middle}
.dot.on{background:var(--tint);box-shadow:none}
.pair{display:grid;grid-template-columns:46px 1fr 38px;gap:9px;align-items:center;
  margin-top:7px}
.pair em{font-style:normal;font-size:12px;color:var(--label-2)}
.pair b{font-size:12px;text-align:right;font-weight:600;color:var(--label-2)}

/* the closing brief, the last thing seen in a campaign */
.brief{border-radius:var(--r-card);padding:19px;background:var(--tint-fill);color:#fff;
  animation:briefin .6s cubic-bezier(.2,.9,.3,1.15) both;position:relative;
  overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3)}
@keyframes briefin{from{opacity:0;transform:translateY(18px) scale(.97)}}
.brief .h{font-size:13px;line-height:18px;font-weight:600;opacity:.85;
  margin-bottom:8px}
.brief .a{font-size:20px;line-height:27px;font-weight:600;letter-spacing:-.45px}
.brief .w{font-size:15px;line-height:21px;opacity:.88;margin-top:11px;
  letter-spacing:-.24px}

/* ------------------------------------------------------ sheet, detents ---
   Two detents like a UISheetPresentationController: a medium stop and a large
   one. Dragging moves between them, dragging past the medium stop dismisses. */
.dim{position:absolute;inset:0;z-index:28;background:rgba(0,0,0,.4);opacity:0;
  animation:fade .3s ease forwards;-webkit-backdrop-filter:blur(2px);
  backdrop-filter:blur(2px)}
@keyframes fade{to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:29;height:56%;
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;display:flex;
  flex-direction:column;box-shadow:0 -12px 44px rgba(0,0,0,.5);
  transform:translateY(100%);
  transition:transform .46s cubic-bezier(.32,.72,0,1),
             height .42s cubic-bezier(.32,.72,0,1)}
.sheet.in{transform:translateY(0)}
.sheet.full{transform:translateY(0);height:92%}
/* sized to its content: every row reachable, nothing padded out to fill */
.sheet.fit{transform:translateY(0);height:auto;max-height:86%}
.sheet.out{transform:translateY(100%)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label-3);
  margin:8px auto 0;flex:none;position:relative;z-index:1}
.shead{display:flex;align-items:flex-start;gap:10px;padding:12px 8px 10px 20px;
  flex:none;position:relative;z-index:1}
.shead .st{flex:1;min-width:0}
.shead h2{margin:0;font-size:22px;line-height:28px;font-weight:700;
  letter-spacing:.35px}
.shead .sub{font-size:13px;line-height:18px;color:var(--label-2);margin-top:2px}
.sclose{flex:none;width:30px;height:30px;border-radius:50%;background:var(--fill);
  color:var(--label-2);display:grid;place-items:center}
.sclose svg{width:15px;height:15px;fill:currentColor}
.sbody{overflow-y:auto;
  padding:0 20px calc(max(26px,env(safe-area-inset-bottom)) + var(--homebar,0px) + 12px);
  scrollbar-width:none;position:relative;z-index:1;
  -webkit-overflow-scrolling:touch}
.sbody::-webkit-scrollbar{display:none}

/* persona picker rows */
.pick{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:11px 12px;border-radius:14px;margin-bottom:2px}
.pick .av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;
  place-items:center;font-size:14px;font-weight:700;background:var(--tint);
  color:#fff;font-family:var(--f-round)}
.pick .nm{flex:1;min-width:0}
.pick .nm b{display:block;font-size:17px;line-height:22px;font-weight:500;
  letter-spacing:-.41px}
.pick .nm span{display:block;font-size:13px;line-height:18px;color:var(--label-2)}
.pick .on{color:var(--tint);flex:none}
.pick .on svg{width:19px;height:19px;fill:currentColor;display:block}

/* toast */
.toast{position:absolute;left:14px;right:14px;z-index:33;
  bottom:calc(96px + var(--homebar,0px) + env(safe-area-inset-bottom));
  border-radius:19px;
  padding:13px 17px;display:flex;align-items:center;gap:14px;font-size:15px;
  letter-spacing:-.24px;box-shadow:var(--glass-shadow);
  animation:tbin .42s cubic-bezier(.2,.9,.3,1.15) both}
.toast>*{position:relative;z-index:1}
.toast button{color:var(--tint);font-size:15px;font-weight:600;flex:none}

/* persona transition: a tinted disc from the tapped point, then a re-entry */
.wipe{position:absolute;inset:0;z-index:40;pointer-events:none;
  clip-path:circle(0% at var(--wx,50%) var(--wy,50%))}
.wipe i{position:absolute;inset:0;display:block;background:var(--wipe-c)}
.wipe.go{animation:win .42s cubic-bezier(.32,.72,0,1) forwards}
.wipe.out{animation:wout .5s ease forwards}
@keyframes win{to{clip-path:circle(145% at var(--wx,50%) var(--wy,50%))}}
@keyframes wout{from{clip-path:circle(145% at var(--wx,50%) var(--wy,50%));opacity:1}
  to{clip-path:circle(145% at var(--wx,50%) var(--wy,50%));opacity:0}}
.wipe .bd{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  text-align:center;color:#fff}
.wipe .bd b{display:block;font-size:28px;font-weight:700;letter-spacing:.36px}
.wipe .bd span{display:block;font-size:15px;opacity:.8;margin-top:5px}
.enter>*{animation:rise .44s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

/* onboarding */
.splash{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:38px 32px;text-align:center}
.splash .sym{width:76px;height:76px;border-radius:22px;background:var(--tint-fill);
  display:grid;place-items:center;color:#fff;margin-bottom:6px;
  box-shadow:0 12px 34px rgba(0,0,0,.4),inset 0 .5px 0 rgba(255,255,255,.4)}
.splash .sym svg{width:38px;height:38px;fill:currentColor}
.splash h1{margin:0;font-size:32px;line-height:38px;font-weight:700;
  letter-spacing:.36px}
.splash h1 i{font-style:normal;color:var(--tint)}
.splash p{margin:0;font-size:17px;line-height:24px;color:var(--label-2);
  max-width:34ch;letter-spacing:-.41px}

/* Small handsets: the type scale is Apple's, which assumes a 390pt screen. On
   a 320 to 375pt device the display sizes need a step down or the large title
   and the revenue figure wrap. */
@media (max-width:380px){
  :root{--gutter:13px}
  .navlarge h1{font-size:30px;line-height:36px}
  .money .v{font-size:29px;line-height:36px}
  .metric .v{font-size:23px;line-height:29px}
  .metric{padding:13px 13px 12px}
  .splash{padding:34px 24px}
  .splash h1{font-size:27px;line-height:33px}
  .splash p{font-size:16px;line-height:23px}
  .start{height:52px;padding:0 18px;font-size:16px;right:12px}
  .btn{padding:0 18px}
  .chip{padding:0 14px}
  .chip[aria-pressed="true"]{padding-left:10px}
  .over{font-size:20px}
}

/* Short screens, from a 568pt handset down to a landscape window: the splash
   centres its stack, which overflows once the viewport is shorter than the
   stack itself. */
@media (max-height:620px){
  .splash{justify-content:flex-start;gap:12px;padding:24px 26px;overflow-y:auto}

const el = id => document.getElementById(id);

const later = (fn, ms) => timers.push(setTimeout(fn, ms));

const on = () => chans().filter(k => picked[k]);
const reduced = () => matchMedia("(prefers-color-scheme: reduce)").matches
  || matchMedia("(prefers-reduced-motion: reduce)").matches;
function resetPicked(){ picked = {}; chans().forEach(k => picked[k] = 1); }

/* A short pulse on state changes that matter. Silent where unsupported, which
   is most desktops, and never used for anything merely decorative. */
function haptic(ms) { try { navigator.vibrate && navigator.vibrate(ms || 8); } catch (e) {} }

const THEMES = ORDER.map(k => BIZ[k].theme);
function applyTheme() {
  const want = B().theme;
  [document.documentElement, el("phone")].forEach(n => {
    if (!n) return;
    THEMES.forEach(t => n.classList.remove(t));
    n.classList.add(want);
    n.classList.toggle("light", lightMode);
  });
}

/* ------------------------------------------------------------- rendering */
function render(keep) {
  timers.forEach(clearTimeout); timers = [];
  const home = view === "home", sc = el("scroll");
  const y = keep ? sc.scrollTop : 0;

  el("nav").innerHTML = home ? navHome() : navFlow();
  el("start").hidden = !home;
  el("toolbar").hidden = home;
  if (home) el("start").innerHTML = svg(ICON.mic) + "Initiate Campaign";
  else el("toolbar").innerHTML = toolbar();

  sc.innerHTML = home ? homeScreen() : flowScreen();
  sc.scrollTop = y;
  el("nav").classList.toggle("compact", y > 26);

  later(() => {
    document.querySelectorAll(".fill[data-w]").forEach(f => f.style.width = f.dataset.w + "%");
    moveKnob();
  }, 60);
  wire();
}

function navHome() {
  const b = B();
  return `<div class="navbar">
    <button class="navbtn avatar glass tap" id="idbtn" onclick="openPicker(event)"
      aria-haspopup="dialog" aria-label="Switch account, currently ${b.name}">
      <span class="ini">${b.ini}</span></button>
    <span class="navttl">${b.name}</span>
    ${themeBtn()}
  </div>
  <div class="navlarge"><h1>${b.name}</h1>
    <p>${b.cat} &middot; ${b.area} &middot; ${b.perf.dir > 0 ? "growing" : "declining"}</p></div>`;
}

function navFlow() {
  return `<div class="navbar">
    <button class="navbtn glass tap" onclick="exitFlow()" aria-label="Close">
      ${svg(ICON.close)}</button>
    <span class="navttl">${STEPS[i].t}</span>

  <div class="navlarge"><h1>${STEPS[i].t}</h1>
    <p>Step ${i + 1} of 4 &middot; campaign ${cyc}</p></div>
  <div class="steps">${STEPS.map((s, n) =>
    `<i class="${n < i ? "done" : n === i ? "now" : ""}"></i>`).join("")}</div>`;
}

function themeBtn() {
  return `<button class="navbtn glass tap themebtn" onclick="toggleTheme()"
    aria-pressed="${lightMode}"
    aria-label="${lightMode ? "Switch to dark appearance" : "Switch to light appearance"}">
    ${svg(lightMode ? ICON.moon : ICON.sun)}</button>`;
}

function toggleTheme() {
  lightMode = !lightMode; haptic(6);
  applyTheme();
  document.querySelectorAll(".themebtn").forEach(b => {
    b.innerHTML = svg(lightMode ? ICON.moon : ICON.sun);
    b.setAttribute("aria-pressed", lightMode);
  });
}

/* one-time listeners: scroll drives the navigation bar, swipe drives the loop */
function wire() {
  if (wired) return; wired = true;
  const sc = el("scroll");
  sc.addEventListener("scroll", () => {
    el("nav").classList.toggle("compact", sc.scrollTop > 26);
  }, {passive:true});

  let x0 = null, y0 = null;
  sc.addEventListener("touchstart", e => {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive:true});
  sc.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (view !== "flow" || Math.abs(dx) < 64 || Math.abs(dy) > 46) return;
    if (dx < 0 && canAdvance()) { haptic(8); step(i + 1); }
    else if (dx > 0) back();
  }, {passive:true});
}
function canAdvance() {
  if (i === 0) return built;
  if (i === 1) return published && !publishing;
  return i < 3;
}

/* Status reads as a leading badge with the title and subtitle in their own
   stack. The old layout put a tag on the title's line, which forced one of

function disc(n, tone, ico, title, sub, rows) {
  const open = stdOpen === n, id = "d" + n, h = "dh" + n;
  return `<div class="disc ${open ? "open" : ""}">
    <button class="item row-tap" id="${h}" aria-expanded="${open}" aria-controls="${id}"

        `<div class="prow"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("")}</div>

}

function toggleDisc(n) {
  stdOpen = stdOpen === n ? -1 : n; haptic(6);
  document.querySelectorAll(".disclist .disc").forEach((d, x) => {
    const open = x === stdOpen;
    d.classList.toggle("open", open);
    const btn = d.querySelector(".item"), inner = d.querySelector(".inner");
    if (btn) btn.setAttribute("aria-expanded", open);
    if (inner) try { inner.inert = !open; } catch (e) {}
  });
}

/* 1 -- say it ------------------------------------------------------------ */
function stepSay() {
  const b = B();
  let out = `<p class="body sec" style="margin:2px 0 16px">${STEPS[0].p}</p>`;

  out += `<div class="seg" id="langseg" role="radiogroup" aria-label="Language">

    if (cyc > 1) out += `<div class="groupfoot" style="padding-top:12px">

  }

  out += `<button class="mic tap ${talking ? "live" : ""}" id="micbox"
      style="margin-top:14px" onclick="replay()" aria-label="Play it again">
      <span class="orb">${talking ? `<span class="wave">${bars(5)}</span>` : svg(ICON.mic)}</span>
      <span class="tx"><b id="micst">${talking ? "Listening" : "Transcribed"}</b>
        <span>${b.at}</span></span></button>

        ? '<i class="cur" id="cur"></i>' : ""}</div></div>

    <div class="grouphead">${cyc === 1 ? "What should I make"

  if (working) {
    out += `<div class="grouphead">Working on it</div>

function toggleChan(k) {
  if (working) return;
  picked[k] = picked[k] ? 0 : 1;
  if (!on().length) picked[k] = 1;
  haptic(5);
  render(true);
}
function setLang(v) {
  if (hin === !!v) return;
  hin = !!v; haptic(5); stopVoice();
  if (view === "flow" && i === 0 && heard) { render(true); listen(); } else render(true);
}
function toggleSound() {
  sound = !sound; haptic(5);
  if (!sound) { stopVoice(); show(said); endSpeech(); }
  render(true);
}
function moveKnob() {
  const seg = el("langseg"); if (!seg) return;
  const k = el("langknob"), n = seg.querySelectorAll("button").length;

function genTrace() {
  const b = B(), g = b.gen, out = [g[0], g[1], g[2]];
  if (picked.seo) out.push(g[3]);
  if (picked.gmb || picked.list) out.push(g[4]);
  chans().forEach(k => { if (picked[k]) out.push(["think", CHAN[k].verb, CHAN[k].hi]); });
  if (b.medical) g.filter(r => r[0] === "chk").forEach(r => out.push(r));
  out.push(["think", "Putting it all together now", "Sab jod kar taiyaar kar raha hoon"]);
  return out;
}

function generate() {
  working = true; built = false; render(true);
  const steps = genTrace();
  steps.forEach(([kind, one, two], n) => later(() => {
    const box = el("tr"); if (!box) return;
    const ic = kind === "src" ? ICON.doc : kind === "chk" ? ICON.shield : ICON.spark;
    box.insertAdjacentHTML("beforeend",
      `<div class="tr ${kind}"><span class="ic">${svg(ic)}</span>
        <span class="gt">${kind === "src" ? one : (hin ? two : one)}
          ${kind === "src" ? `<span class="gd">${two}</span>` : ""}</span></div>`);
    el("scroll").scrollTop = 9e5;
  }, 500 * n + 180));
  later(showMade, 500 * steps.length + 300);
}

/* Doherty threshold: a narrative sequence still has to be escapable. */
function skipGen() {
  timers.forEach(clearTimeout); timers = [];
  const box = el("tr");
  if (box) {
    box.innerHTML = "";
    genTrace().forEach(([kind, one, two]) => {
      const ic = kind === "src" ? ICON.doc : kind === "chk" ? ICON.shield : ICON.spark;
      box.insertAdjacentHTML("beforeend",
        `<div class="tr ${kind}" style="animation:none"><span class="ic">${svg(ic)}</span>
          <span class="gt">${kind === "src" ? one : (hin ? two : one)}
            ${kind === "src" ? `<span class="gd">${two}</span>` : ""}</span></div>`);
    });
  }
  showMade();
}

function liveTrace() {
  const b = B(), out = [], where = [];

}
const joinList = a => a.length < 2 ? (a[0] || "")
  : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];

function publish() {
  published = true; publishing = true; haptic(12); render();

    el("scroll").scrollTop = 9e5;
    if (n === steps.length - 1) {

const rowOpen = (k, n, inner) =>
  `<button class="item row-tap" onclick="openRow('${k}',${n})"

const DRAW = {
  site: d => {

      <span class="barhead"><span class="k">${path}</span>

  },
  seo: d => d.rows.map(([q, pos, prev, clicks], n) => {
    const at = p => Math.min((p - 1) / 29 * 100, 100), miss = pos === 0;
    return rowOpen("seo", n, `
      <span class="barhead"><span class="k">${q}</span>
        <span class="v num">${miss ? "&mdash;" : ordinal(pos)}</span></span>

  }).join("") ,
  geo: d => `<div class="barrow"><div class="barhead">

  gmb: d => d.rows.map(([k, v, delta], n) =>
    `<button class="item row-tap" onclick="openRow('gmb',${n})">

function recurCard() {
  const b = B(), v = b.recur.series, hi = Math.max(...v);
  const first = v[0], last = v[v.length - 1], up = last >= first;
  return `<div class="grouphead">${b.recur.label}, month on month</div>

      <div class="cols" style="height:44px">${v.map((n, x) =>
        `<i class="${x === v.length - 1 ? "on" : ""}"
            style="height:${Math.max(5, n / hi * 44)}px;animation-delay:${x * 22}ms"></i>`).join("")}</div>
      <div class="axis"><span>12 months ago</span><span>this month</span></div></div>`;
}

function ordinal(n) {
  const t = n % 100;
  return n + (t > 3 && t < 21 ? "th" : ["th","st","nd","rd"][n % 10] || "th");
}

/* ------------------------------------------------------------- toolbar --- */
function toolbar() {
  let label, action, dis = false, hint = "";
  if (i === 0 && !heard)          { label = "Say It";             action = "listen()"; }
  else if (i === 0 && !working)   { label = "Generate";           action = "generate()"; }
  else if (i === 0 && !built)     { label = "Working on it\u2026";     action = ""; dis = true;
                                    hint = "Going through your account before I make anything"; }
  else if (i === 0)               { label = "Review";             action = "step(1)"; }
  else if (i === 1 && !published) { label = "Publish";            action = "publish()";
                                    dis = !confirmed;
                                    hint = confirmed ? ""
                                      : "Confirm you have reviewed these"; }
  else if (i === 1 && publishing) { label = "Publishing\u2026";       action = ""; dis = true; }
  else if (i === 1)               { label = "See Results";        action = "step(2)"; }
  else if (i === 2)               { label = "See What\u2019s Next";   action = "step(3)"; }
  else                            { label = `Start Campaign ${cyc + 1}`; action = "nextCycle()"; }

  return (hint ? `<div class="tbhint">${hint}</div>` : "") +
    `<div class="tbrow">
      <button class="btn plain tap" onclick="back()">${i === 0 ? "Home" : "Back"}</button>
      <button class="btn filled tap" id="fwd" ${dis ? "disabled" : ""}
        onclick="${action}">${label}</button></div>`;
}
function refreshBar() { if (view === "flow") el("toolbar").innerHTML = toolbar(); }
function step(n) { stopVoice(); i = n; tab = 0; render(); }
function back() { stopVoice(); if (i === 0) return exitFlow(); i--; render(); }
function nextCycle() {
  stopVoice(); cyc++; i = 0; tab = 0; haptic(10);
  heard = working = built = confirmed = published = publishing = false;
  shown = ""; render();
}
function openFlow() { stopVoice(); haptic(8); view = "flow"; i = 0; render(); }
function exitFlow() { stopVoice(); view = "home"; render(); }
function begin() {
  el("splash").hidden = true;
  ["nav","scroll","start","toolbar"].forEach(id => {
    const n = el(id); if (n) try { n.inert = false; } catch (e) {}
  });
  safeRender();
}
function safeRender() {
  try { render(); }
  catch (err) {
    el("scroll").innerHTML = `<div class="grouphead">Something went wrong</div>
      <div class="list"><div class="item"><span class="txt"><span class="t">${
        String((err && err.message) || err)}</span></span></div></div>`;
    throw err;
  }
}

/* ------------------------------------------------------ sheet, detents ---
   Opens at the medium detent. Drag up to go large, drag down to step back and
   then dismiss, which is how a UISheetPresentationController behaves. */
function sheet(title, sub, rows, hero) {
  lastFocus = document.activeElement;
  el("dim").hidden = false;
  const s = el("sheet");
  s.hidden = false; sheetMode = hero ? "full" : "in";
  s.className = "sheet glass-thick";
  s.style.transform = "";
  s.innerHTML = `<div class="grab"></div>
    <div class="shead"><span class="st"><h2 id="sheetTitle">${title}</h2>
      <div class="sub">${sub}</div></span>
      <button class="sclose tap" onclick="shut()" aria-label="Close">
        ${svg(ICON.close)}</button></div>
    <div class="sbody">${hero || ""}
      <div class="list" style="margin-top:${hero ? "4px" : "0"}">${rows.map(([k, v]) =>
        `<div class="item" style="display:block;padding:12px 16px">
          <span class="k foot sec" style="display:block">${k}</span>
          <span class="body" style="display:block;margin-top:2px">${v}</span></div>`
      ).join("")}</div><div style="height:20px"></div></div>`;
  requestAnimationFrame(() => s.classList.add(sheetMode === "full" ? "full" : "in"));
  dragSheet(s);
  later(() => { const f = s.querySelector("button"); if (f) f.focus(); }, 80);
}

function shut() {
  const s = el("sheet"); if (s.hidden) return;
  s.className = "sheet glass-thick out"; s.style.transform = "";
  el("dim").hidden = true;
  setTimeout(() => { s.hidden = true; s.innerHTML = ""; }, 420);
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
}

let sheetBound = null;
function dragSheet(s) {
  const grab = s.querySelector(".grab"), head = s.querySelector(".shead");
  let y0 = null, dy = 0;
  const start = e => { y0 = (e.touches ? e.touches[0] : e).clientY; dy = 0;
    s.style.transition = "none"; };
  const move = e => {
    if (y0 === null) return;
    dy = (e.touches ? e.touches[0] : e).clientY - y0;
    /* downward drags track the finger; upward ones only hint, because the
       sheet cannot grow past the large detent */
    const shift = dy > 0 ? dy
      : (sheetMode === "full" || sheetMode === "fit" ? 0 : dy * 0.16);
    s.style.transform = `translateY(${shift}px)`;
  };
  const end = () => {
    if (y0 === null) return;
    y0 = null; s.style.transition = ""; s.style.transform = "";
    if (sheetMode === "fit") { if (dy > 90) shut(); return; }
    if (dy < -60 && sheetMode !== "full") {
      sheetMode = "full"; s.className = "sheet glass-thick full"; haptic(6);
    } else if (dy > 90) {
      if (sheetMode === "full") {
        sheetMode = "in"; s.className = "sheet glass-thick in"; haptic(6);
      } else shut();
    }
  };
  [grab, head].forEach(n => {
    if (!n) return;
    n.addEventListener("touchstart", start, {passive:true});
    n.addEventListener("touchmove", move, {passive:true});
    n.addEventListener("touchend", end);
    n.addEventListener("mousedown", start);
  });
  if (sheetBound) {
    document.removeEventListener("mousemove", sheetBound.m);
    document.removeEventListener("mouseup", sheetBound.u);
  }
  sheetBound = {m:move, u:end};
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", end);
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") return shut();
  const s = el("sheet");
  if (e.key !== "Tab" || s.hidden) return;
  const f = s.querySelectorAll("button, [href], input, [tabindex]:not([tabindex='-1'])");
  if (!f.length) return;
  const a = f[0], z = f[f.length - 1];
  if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
  else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
});

function toast(text, action, fn) {

}

/* ------------------------------------------------------------------ voice */
function loadVoices() {
  voices = (window.speechSynthesis || {}).getVoices ? speechSynthesis.getVoices() : [];
}
if (window.speechSynthesis) {
  loadVoices();
  speechSynthesis.addEventListener("voiceschanged", loadVoices);
}
/* The line being read out is an Indian owner talking about their own shop, so
   locale is ranked above engine quality: an ordinary en-IN voice reads truer
   here than a neural en-US one. Falling back through en-GB before en-US only
   because it is the nearer accent of the two. */
const VOICE_LANGS = {
  hinglish: [/^hi-IN/i, /^hi(-|$)/i, /^en-IN/i, /^en-GB/i, /^en(-|$)/i],
  english:  [/^en-IN/i, /^en-GB/i, /^en(-|$)/i]
};

/* Indian voices shipped by the platforms. Microsoft: Neerja and Prabhat are
   en-IN, Swara and Madhur hi-IN, Heera and Ravi the older en-IN pair. Apple:
   Rishi en-IN, Lekha hi-IN. Google labels its Hindi voice in Devanagari. */
const INDIAN_VOICE = new RegExp("neerja|prabhat|swara|madhur|heera|ravi|kalpana|"
  + "hemant|rishi|lekha|veena|sangeeta|isha|hindi|हिन्दी"
  + "|\\(india\\)", "i");

/* Within one locale an Indian name outranks everything, then a neural engine,
   and the three flat Windows defaults go to the back. */
function indianVoiceScore(v) {
  let score = 0;
  if (INDIAN_VOICE.test(v.name)) score += 4;
  if (/natural|neural|premium|enhanced/i.test(v.name)) score += 2;
  if (/siri/i.test(v.name)) score += 1;
  if (/david|mark|zira/i.test(v.name)) score -= 3;
  return score;
}

function pickVoice() {
  const langs = hin ? VOICE_LANGS.hinglish : VOICE_LANGS.english;
  for (const lang of langs) {
    const pool = voices.filter(v => lang.test(v.lang));
    if (!pool.length) continue;
    return pool.slice().sort((a, b) => indianVoiceScore(b) - indianVoiceScore(a))[0];
  }
  return null;
}

function show(txt) {
  shown = txt;
  const t = el("tt"); if (t) t.textContent = txt;
  const s = el("scroll"); if (s) s.scrollTop = 9e5;
}
function endSpeech() {
  talking = false;
  const c = el("cur"), m = el("micbox"), st = el("micst");
  if (c) c.remove();
  if (m) m.classList.remove("live");
  if (st) st.textContent = "Transcribed";
  refreshBar();
}
function reveal(text, done) {
  const words = text.split(" "); let n = 0;
  const go = () => {
    n++; show(words.slice(0, n).join(" "));
    if (n < words.length) vtimers.push(setTimeout(go, 90 + words[n - 1].length * 34));
    else done();
  };
  go();
}

/* Every line is pre-rendered by hi-IN and en-IN neural voices and served from
   this folder, so the accent no longer depends on what the visitor happens to
   have installed. Absolute path, because the page answers on both
   /modalx/smb-offering and /modalx/smb-offering.html. */
const clipFor = (who, lang) => `/modalx/audio/${biz}-${who}-${lang}.mp3`;
let clipEl = null;

/* Reveal against real elapsed audio rather than a word-length guess. */
function playClip(src, display, onFail) {
  const clip = new Audio(src);
  const words = display.split(" ");
  let failed = false;
  const fail = () => { if (!failed) { failed = true; onFail(); } };
  clip.preload = "auto";
  clip.ontimeupdate = () => {
    if (!clip.duration || !isFinite(clip.duration)) return;
    const upto = Math.min(words.length,
      Math.max(1, Math.round(clip.currentTime / clip.duration * words.length)));
    show(words.slice(0, upto).join(" "));
  };
  clip.onended = () => { show(display); endSpeech(); };
  clip.onerror = fail;
  clipEl = clip;
  const started = clip.play();
  if (started && started.catch) started.catch(fail);
}

/* Devanagari goes to a Hindi voice and nowhere else. Handing it to an English
   engine is what produced the tourist-with-a-phrasebook delivery: it has no
   Devanagari phonology, so it transliterates letter by letter. The same voice
   reading the romanised line lands much closer, because the spelling already
   encodes how the words are said, so this fallback swaps the script instead of
   the accent. */
function speakLine(display, devanagari) {
  if (!window.speechSynthesis) return reveal(display, endSpeech);
  speechSynthesis.cancel();
  const v = pickVoice();
  const hindiVoice = !!v && /^hi(-|$)/i.test(v.lang);
  const spoken = hindiVoice && devanagari ? devanagari : display;
  const u = new SpeechSynthesisUtterance(spoken);
  /* Tag the locale even when no voice object matched: a bare utterance marked
     en-IN still gets an Indian default on most engines, where an untagged one
     gets the system's en-US. */
  u.lang = (v && v.lang) || "en-IN";
  if (v) u.voice = v;
  u.rate = hindiVoice ? 0.94 : 0.96; u.pitch = 1.0;
  /* When the spoken script differs from the displayed one the character offsets
     do not map, so sync on progress through the spoken words instead. */
  const words = display.split(" "), total = spoken.split(" ").length;
  let boundaries = 0;
  u.onboundary = e => {
    if (e.charIndex == null) return;
    boundaries++;
    const done = spoken.slice(0, e.charIndex).split(" ").length;
    const upto = Math.min(Math.max(Math.round(done / total * words.length), 1), words.length);
    show(words.slice(0, upto).join(" "));
  };
  u.onend = () => { show(display); endSpeech(); };
  u.onerror = () => { show(display); endSpeech(); };
  speechSynthesis.speak(u);
  vtimers.push(setTimeout(() => { if (!boundaries) reveal(display, () => {}); }, 700));
}

function transcribe(display, devanagari, clip) {
  said = display;
  if (!sound) return reveal(display, endSpeech);
  if (clip) return playClip(clip, display, () => speakLine(display, devanagari));
  speakLine(display, devanagari);
}

function stopVoice() {
  vtimers.forEach(clearTimeout); vtimers = [];
  if (clipEl) { clipEl.pause(); clipEl.onended = clipEl.ontimeupdate = null; clipEl = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
}
function replay() { stopVoice(); listen(); }

function listen() {
  stopVoice(); haptic(8);
  view = "flow"; i = 0; heard = true; talking = true; shown = "";
  render();
  const b = B();
  const first = cyc === 1;
  const line = first ? (hin ? b.sayHi : b.say) : (hin ? b.nextHi : b.next);
  transcribe(line, hin ? (first ? b.sayDev : b.nextDev) : null,
    clipFor(first ? "say" : "next", hin ? "hi" : "en"));
}


/* ==============================================  DEVICE CHROME  =========
   The status bar reads real values where the browser exposes them: the clock
   is the actual time and the battery is the actual battery. Signal and Wi-Fi
   have no web API, so they are drawn full and left alone. */
function statusIcons(level, charging) {
  const bars = [4, 6.5, 9, 11.5];
  const cell = bars.map((h, n) =>
    `<rect x="${n * 4.6}" y="${12 - h}" width="3.2" height="${h}" rx="1.1"
      ${n > 3 ? 'opacity=".35"' : ""}/>`).join("");
  const pct = Math.round(level * 100);
  return `<svg viewBox="0 0 17 12" width="17" height="12">${cell}</svg>
    <svg viewBox="0 0 16 12" width="16" height="12">
      <path d="M8 10.6 6.1 8.5a2.9 2.9 0 0 1 3.8 0L8 10.6Z"/>
      <path d="M8 6.2c1.3 0 2.5.5 3.4 1.3l1.3-1.4A6.9 6.9 0 0 0 8 4.3a6.9 6.9 0 0 0-4.7 1.8l1.3 1.4A5 5 0 0 1 8 6.2Z" opacity=".95"/>
      <path d="M8 2.1c2.3 0 4.5.9 6.1 2.3l1.2-1.4A10.9 10.9 0 0 0 8 .2 10.9 10.9 0 0 0 .7 3l1.2 1.4A9 9 0 0 1 8 2.1Z" opacity=".95"/>
    </svg>
    <span class="sb-batt-pct" style="font-size:12px;opacity:.85;margin-right:1px">${pct}</span>
    <span class="batt ${charging ? "charging" : ""} ${pct <= 20 && !charging ? "low" : ""}">
      <i style="width:calc(${Math.max(pct, 3)}% - ${3.6 * (1 - Math.max(pct, 3) / 100)}px)"></i>
    </span>`;
}

let battLevel = 0.82, battCharging = false;
function paintStatus() {
  const t = el("sbtime"), r = el("sbright");
  if (t) {
    const d = new Date(), h = d.getHours() % 12 || 12;
    t.textContent = h + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  if (r) r.innerHTML = statusIcons(battLevel, battCharging);
}
function startStatus() {
  paintStatus();
  /* tick on the minute boundary rather than every 60s from load, so the
     displayed minute is never up to 59 seconds stale */
  const toMinute = 60000 - (Date.now() % 60000);
  setTimeout(function tick() { paintStatus(); setTimeout(tick, 60000); }, toMinute + 40);
  if (navigator.getBattery) navigator.getBattery().then(b => {
    const sync = () => { battLevel = b.level; battCharging = b.charging; paintStatus(); };
    b.addEventListener("levelchange", sync);
    b.addEventListener("chargingchange", sync);
    sync();
  }).catch(() => {});
}

/* The home indicator is the real gesture, not a painted stripe: swipe up or
   press to dismiss a sheet, then to leave the loop, then nothing. */
function wireHome() {
  const bar = el("homebar"); if (!bar) return;
  const go = () => {
    if (!el("sheet").hidden) return shut();
    if (view === "flow") { haptic(10); exitFlow(); }
  };
  let y0 = null;
  bar.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; }, {passive:true});
  bar.addEventListener("touchend", e => {
    if (y0 === null) return;
    const dy = e.changedTouches[0].clientY - y0; y0 = null;
    if (dy < -26) go();
  }, {passive:true});
  let my = null;
  bar.addEventListener("mousedown", e => { my = e.clientY; });
  document.addEventListener("mouseup", e => {
    if (my === null) return;
    const dy = e.clientY - my; my = null;
    if (dy < -18) go();
  });
  bar.addEventListener("click", e => { if (e.detail) go(); });
  bar.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); }
  });
}

/* -------------------------------------------------------------------- init */
resetPicked();
applyTheme();
el("splashsym").innerHTML = svg(ICON.mic);
startStatus();
wireHome();
["nav","scroll","start","toolbar"].forEach(id => {
  const n = el(id); if (n) try { n.inert = true; } catch (e) {}
});
safeRender();
</script>
